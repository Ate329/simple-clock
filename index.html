<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Clock</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600&family=JetBrains+Mono:wght@100;200;300;400&family=Roboto+Mono:wght@100;200;300;400&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background-color: #000;
        }

        /* Animated Mesh Gradient Background */
        .aurora-bg {
            background:
                radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 1) 0, transparent 50%);
            background-size: 200% 200%;
            animation: aurora 15s ease infinite alternate;
        }

        @keyframes aurora {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Floating Animation */
        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        /* Glassmorphism 2.0 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .glass-button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        /* Custom Font for Clock */
        .font-mono-clock {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Fade In Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        /* Hide scrollbar */
        ::-webkit-scrollbar {
            width: 0px;
        }
    </style>
</head>

<body class="text-white h-screen w-screen selection:bg-white/20">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Components ---

        const WeatherIcon = ({ code, className }) => {
            // Simple mapping for demo purposes
            if (code === 0) return <i data-lucide="sun" className={className}></i>;
            if ([1, 2, 3].includes(code)) return <i data-lucide="cloud-sun" className={className}></i>;
            if ([45, 48].includes(code)) return <i data-lucide="cloud-fog" className={className}></i>;
            if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return <i data-lucide="cloud-rain" className={className}></i>;
            if ([71, 73, 75, 85, 86].includes(code)) return <i data-lucide="snowflake" className={className}></i>;
            if ([95, 96, 99].includes(code)) return <i data-lucide="cloud-lightning" className={className}></i>;
            return <i data-lucide="cloud" className={className}></i>;
        };

        const Clock = ({ time, format24h, font }) => {
            const hours = time.getHours();
            const minutes = time.getMinutes().toString().padStart(2, '0');

            let displayHours = hours;
            let suffix = '';

            if (!format24h) {
                suffix = hours >= 12 ? 'PM' : 'AM';
                displayHours = hours % 12 || 12;
            } else {
                displayHours = hours.toString().padStart(2, '0');
            }

            return (
                <div className="flex items-baseline justify-center gap-2 md:gap-4">
                    <h1 className="text-[15vw] md:text-[13rem] leading-none font-thin tracking-tighter text-white drop-shadow-2xl select-none" style={{ fontFamily: font }}>
                        {displayHours}:{minutes}
                    </h1>
                    {!format24h && (
                        <span className="text-xl md:text-3xl font-light text-white/40 tracking-widest">
                            {suffix}
                        </span>
                    )}
                </div>
            );
        };

        const Greeting = ({ time }) => {
            const hour = time.getHours();
            let greeting = "Good Evening";
            if (hour >= 5 && hour < 12) greeting = "Good Morning";
            else if (hour >= 12 && hour < 18) greeting = "Good Afternoon";

            return (
                <div className="text-xl md:text-2xl font-light text-white/60 tracking-widest uppercase mb-2 animate-fade-in">
                    {greeting}
                </div>
            );
        };

        const DateDisplay = ({ time }) => {
            const dateString = time.toLocaleDateString('en-US', {
                weekday: 'long',
                month: 'long',
                day: 'numeric'
            });
            return <div className="text-lg md:text-xl text-white/40 font-light">{dateString}</div>;
        };

        const WeatherWidget = ({ weather, loading, useCelsius, detailed }) => {
            if (loading) return <div className="animate-pulse text-white/30 text-sm">Updating weather...</div>;
            if (!weather) return null;

            const currentTemp = weather.current?.temperature_2m;
            const weatherCode = weather.current?.weather_code;
            const humidity = weather.current?.relative_humidity_2m;
            const windSpeed = weather.current?.wind_speed_10m;
            const maxTemp = weather.daily?.temperature_2m_max[0];
            const minTemp = weather.daily?.temperature_2m_min[0];

            const displayTemp = (temp) => {
                if (temp === undefined) return '--';
                if (useCelsius) return `${Math.round(temp)}°`;
                return `${Math.round((temp * 9 / 5) + 32)}°`;
            };

            return (
                <div className={`glass-panel px-8 py-6 rounded-3xl flex flex-col items-center gap-4 hover:bg-white/5 transition-colors cursor-default ${detailed ? 'min-w-[280px]' : ''}`}>
                    <div className="text-6xl text-white/90 drop-shadow-lg">
                        <WeatherIcon code={weatherCode} />
                    </div>
                    <div className="flex flex-col items-center">
                        <span className="text-5xl font-light tracking-tight">{displayTemp(currentTemp)}</span>
                        <div className="flex gap-4 text-sm text-white/40 font-medium mt-2">
                            <span>H: {displayTemp(maxTemp)}</span>
                            <span>L: {displayTemp(minTemp)}</span>
                        </div>
                    </div>

                    {detailed && (
                        <div className="grid grid-cols-2 gap-x-8 gap-y-2 mt-4 pt-4 border-t border-white/10 w-full text-sm">
                            <div className="flex flex-col items-center">
                                <span className="text-white/40 text-xs uppercase tracking-wider">Humidity</span>
                                <span className="text-white/80">{humidity}%</span>
                            </div>
                            <div className="flex flex-col items-center">
                                <span className="text-white/40 text-xs uppercase tracking-wider">Wind</span>
                                <span className="text-white/80">{Math.round(windSpeed)} km/h</span>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const ForecastWidget = ({ weather, useCelsius }) => {
            if (!weather || !weather.daily) return null;

            const daily = weather.daily;
            const nextDays = [1, 2, 3]; // Get next 3 days

            const getDayName = (dateStr) => {
                const date = new Date(dateStr);
                return date.toLocaleDateString('en-US', { weekday: 'short' });
            };

            const displayTemp = (temp) => {
                if (temp === undefined) return '--';
                if (useCelsius) return `${Math.round(temp)}°`;
                return `${Math.round((temp * 9 / 5) + 32)}°`;
            };

            return (
                <div className="flex gap-4 mt-6 justify-center animate-fade-in" style={{ animationDelay: '0.2s' }}>
                    {nextDays.map(i => (
                        <div key={i} className="glass-panel p-4 rounded-2xl flex flex-col items-center gap-2 min-w-[90px] hover:bg-white/5 transition-colors cursor-default">
                            <span className="text-white/60 text-sm font-medium">{getDayName(daily.time[i])}</span>
                            <div className="text-2xl text-white/90 my-1">
                                <WeatherIcon code={daily.weather_code[i]} className="w-8 h-8" />
                            </div>
                            <div className="flex flex-col text-xs font-medium gap-1">
                                <span className="text-white/90">{displayTemp(daily.temperature_2m_max[i])}</span>
                                <span className="text-white/40">{displayTemp(daily.temperature_2m_min[i])}</span>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        const QuoteWidget = () => {
            const [quote, setQuote] = useState({ text: "Loading inspiration...", author: "" });

            useEffect(() => {
                const fetchQuote = async () => {
                    const cached = localStorage.getItem('smart_display_quote');
                    const now = Date.now();

                    // Use cached if less than 4 hours old
                    if (cached) {
                        try {
                            const { text, author, timestamp } = JSON.parse(cached);
                            if (now - timestamp < 4 * 60 * 60 * 1000) {
                                setQuote({ text, author });
                                return;
                            }
                        } catch (e) {
                            console.error("Error parsing cached quote", e);
                        }
                    }

                    try {
                        const res = await fetch('https://dummyjson.com/quotes/random');
                        const data = await res.json();
                        const newQuote = { text: data.quote, author: data.author, timestamp: now };
                        localStorage.setItem('smart_display_quote', JSON.stringify(newQuote));
                        setQuote(newQuote);
                    } catch (error) {
                        console.error("Failed to fetch quote", error);
                        // Fallback
                        setQuote({ text: "The only way to do great work is to love what you do.", author: "Steve Jobs" });
                    }
                };

                fetchQuote();
            }, []);

            return (
                <div className="mt-12 max-w-lg text-center animate-fade-in mx-auto" style={{ animationDelay: '0.5s' }}>
                    <p className="text-white/50 italic font-light">"{quote.text}"</p>
                    <p className="text-white/30 text-xs mt-2 uppercase tracking-wider">— {quote.author}</p>
                </div>
            );
        };

        const SettingsModal = ({ isOpen, onClose, settings, updateSettings }) => {
            if (!isOpen) return null;

            return (
                <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md transition-all duration-300" onClick={onClose}>
                    <div
                        className="glass-panel w-full max-w-md p-8 rounded-3xl shadow-2xl m-4 space-y-8 transform transition-all scale-100 border border-white/10"
                        onClick={e => e.stopPropagation()}
                    >
                        <div className="flex justify-between items-center border-b border-white/10 pb-6">
                            <h2 className="text-2xl font-light tracking-wide text-white">Display Settings</h2>
                            <button onClick={onClose} className="text-white/40 hover:text-white transition-colors">
                                <i data-lucide="x" className="w-6 h-6"></i>
                            </button>
                        </div>

                        <div className="space-y-8">
                            {/* Toggle Row Helper */}
                            {[
                                { label: '24-Hour Clock', icon: 'clock', key: 'format24h' },
                                { label: 'Use Celsius', icon: 'thermometer', key: 'useCelsius' },
                                { label: 'Detailed Weather', icon: 'cloud-lightning', key: 'detailedWeather' },
                                { label: 'Show Forecast', icon: 'calendar-days', key: 'showForecast' },
                                { label: 'Focus Mode', icon: 'eye-off', key: 'focusMode' },
                                { label: 'Show Quote', icon: 'quote', key: 'showQuote' }
                            ].map(item => (
                                <div key={item.key} className="flex items-center justify-between group">
                                    <div className="flex items-center gap-4 text-white/70 group-hover:text-white transition-colors">
                                        <i data-lucide={item.icon} className="w-5 h-5"></i>
                                        <span className="text-lg font-light">{item.label}</span>
                                    </div>
                                    <button
                                        onClick={() => updateSettings(item.key, !settings[item.key])}
                                        className={`w-14 h-8 rounded-full p-1 transition-all duration-300 ${settings[item.key] ? 'bg-indigo-500 shadow-[0_0_15px_rgba(99,102,241,0.5)]' : 'bg-white/10'}`}
                                    >
                                        <div className={`w-6 h-6 bg-white rounded-full shadow-sm transform transition-transform duration-300 ${settings[item.key] ? 'translate-x-6' : 'translate-x-0'}`}></div>
                                    </button>
                                </div>
                            ))}

                            {/* Clock Font */}
                            <div className="space-y-4 pt-2">
                                <div className="flex items-center justify-between text-white/70">
                                    <div className="flex items-center gap-4">
                                        <i data-lucide="type" className="w-5 h-5"></i>
                                        <span className="text-lg font-light">Clock Font</span>
                                    </div>
                                </div>
                                <div className="grid grid-cols-3 gap-2">
                                    {['JetBrains Mono', 'Roboto Mono', 'Space Mono'].map(font => (
                                        <button
                                            key={font}
                                            onClick={() => updateSettings('clockFont', font)}
                                            className={`px-3 py-2 rounded-lg text-xs border transition-all ${settings.clockFont === font ? 'bg-white text-black border-white' : 'bg-white/5 text-white/60 border-white/10 hover:bg-white/10'}`}
                                            style={{ fontFamily: font }}
                                        >
                                            {font.split(' ')[0]}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Brightness */}
                            <div className="space-y-4 pt-2">
                                <div className="flex items-center justify-between text-white/70">
                                    <div className="flex items-center gap-4">
                                        <i data-lucide="sun" className="w-5 h-5"></i>
                                        <span className="text-lg font-light">Brightness</span>
                                    </div>
                                    <span className="text-xs font-mono bg-white/10 px-2 py-1 rounded">{settings.brightness}%</span>
                                </div>
                                <input
                                    type="range"
                                    min="10"
                                    max="100"
                                    value={settings.brightness}
                                    onChange={(e) => updateSettings('brightness', parseInt(e.target.value))}
                                    className="w-full h-1.5 bg-white/10 rounded-lg appearance-none cursor-pointer accent-indigo-500 hover:accent-indigo-400"
                                />
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Main App ---

        const App = () => {
            const [time, setTime] = useState(new Date());
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);

            // Consolidated Settings State
            const [settings, setSettings] = useState({
                format24h: false,
                useCelsius: true,
                detailedWeather: false,
                showForecast: false,
                brightness: 100,
                focusMode: false,
                showQuote: true,
                clockFont: 'JetBrains Mono'
            });

            const [weather, setWeather] = useState(null);
            const [loadingWeather, setLoadingWeather] = useState(true);

            // Update settings helper
            const updateSettings = (key, value) => {
                setSettings(prev => ({ ...prev, [key]: value }));
            };

            // Initialize Icons
            useEffect(() => {
                lucide.createIcons();
            }, [weather, isSettingsOpen, settings]); // Re-run when UI chunks change

            // Clock Tick
            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            // Fetch Weather
            useEffect(() => {
                const fetchWeather = async (lat, lon) => {
                    try {
                        setLoadingWeather(true);
                        const response = await fetch(
                            `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,relative_humidity_2m,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`
                        );
                        const data = await response.json();
                        setWeather(data);
                    } catch (error) {
                        console.error("Failed to fetch weather", error);
                    } finally {
                        setLoadingWeather(false);
                    }
                };

                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => fetchWeather(pos.coords.latitude, pos.coords.longitude),
                        () => fetchWeather(40.7128, -74.0060)
                    );
                } else {
                    fetchWeather(40.7128, -74.0060);
                }
            }, []);

            return (
                <div className="relative h-screen w-screen flex flex-col items-center justify-center overflow-hidden aurora-bg text-white">

                    {/* Brightness Overlay */}
                    <div
                        className="absolute inset-0 bg-black pointer-events-none transition-opacity duration-300 z-50"
                        style={{ opacity: (100 - settings.brightness) / 100 }}
                    ></div>

                    {/* Ambient Orbs */}
                    <div className="absolute top-[-10%] left-[-10%] w-[40vw] h-[40vw] bg-purple-600/20 rounded-full blur-[100px] animate-pulse"></div>
                    <div className="absolute bottom-[-10%] right-[-10%] w-[40vw] h-[40vw] bg-blue-600/20 rounded-full blur-[100px] animate-pulse" style={{ animationDelay: '2s' }}></div>

                    {/* Main Content Area */}
                    <main className="z-10 flex flex-col items-center justify-center text-center w-full max-w-7xl px-4">

                        {/* Greeting - Hidden in Focus Mode */}
                        <div className={`w-full flex flex-col items-center transition-all duration-700 ${settings.focusMode ? 'opacity-0 -translate-y-10 h-0 overflow-hidden' : 'opacity-100 translate-y-0'}`}>
                            <Greeting time={time} />
                        </div>

                        {/* Date - Always Visible */}
                        <div className="w-full flex flex-col items-center transition-all duration-500">
                            <DateDisplay time={time} />
                        </div>

                        {/* Clock - Always Visible */}
                        <div className="w-full flex justify-center my-6">
                            <Clock time={time} format24h={settings.format24h} font={settings.clockFont} />
                        </div>

                        {/* Footer Info */}
                        <div className={`w-full flex flex-col items-center transition-all duration-700 delay-100 ${settings.focusMode ? 'opacity-0 translate-y-10 scale-95 pointer-events-none h-0 overflow-hidden' : 'opacity-100 translate-y-0 scale-100'}`}>
                            <div className="w-full flex flex-col items-center mt-8">
                                <WeatherWidget
                                    weather={weather}
                                    loading={loadingWeather}
                                    useCelsius={settings.useCelsius}
                                    detailed={settings.detailedWeather}
                                />

                                {settings.showForecast && (
                                    <ForecastWidget
                                        weather={weather}
                                        useCelsius={settings.useCelsius}
                                    />
                                )}
                            </div>

                            {settings.showQuote && <QuoteWidget />}
                        </div>

                    </main>

                    {/* Settings Toggle */}
                    <button
                        onClick={() => setIsSettingsOpen(true)}
                        className="absolute bottom-8 right-8 p-4 text-white/30 hover:text-white transition-all duration-300 rounded-full hover:bg-white/10 z-40 group"
                    >
                        <i data-lucide="settings" className="w-6 h-6 group-hover:rotate-90 transition-transform duration-500"></i>
                    </button>

                    {/* Settings Modal */}
                    <SettingsModal
                        isOpen={isSettingsOpen}
                        onClose={() => setIsSettingsOpen(false)}
                        settings={settings}
                        updateSettings={updateSettings}
                    />

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
